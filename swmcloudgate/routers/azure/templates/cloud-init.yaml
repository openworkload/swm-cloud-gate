#cloud-config
disable_root: false
# Root/cluster access is key-based only (see setup_passwordless_root_ssh).
ssh_pwauth: false

# Keep this list minimal. Azure HPC/GPU images already ship Moby Docker;
# installing docker.io here removes moby-* and races apt with runcmd.
# Docker is ensured in swm-init.sh (setup_docker). blobfuse2 needs the
# Microsoft apt repo, so it is also installed from the script.
packages:
  - cgroupfs-mount
  - net-tools
  - nfs-common
  - nfs-kernel-server

package_update: false
package_upgrade: false

write_files:
  - path: /tmp/swm-init.sh
    permissions: '0755'
    content: |+
{{cloud_init_script}}

runcmd:
  - bash -ex /tmp/swm-init.sh
