#cloud-config
disable_root: false
# Root/cluster access is key-based only (see setup_passwordless_root_ssh).
ssh_pwauth: false

# Keep this list minimal. Job containers use rootful Podman + crun, installed
# in swm-init.sh (setup_podman) to avoid apt races with cloud-init packages.
# blobfuse2 needs the Microsoft apt repo, so it is installed from the script.
packages:
  - cgroupfs-mount
  - net-tools
  - nfs-common
  - nfs-kernel-server

package_update: false
package_upgrade: false

write_files:
  - path: /tmp/swm-init.sh
    permissions: '0755'
    content: |+
{{cloud_init_script}}

runcmd:
  - bash -ex /tmp/swm-init.sh
